name: EDUNEXT DEMO D4 — offline real en navegador

on:
  push:
    branches:
      - feature/edunext-demo-d4
      - feature/edunext-demo-d5
      - main
    paths:
      - 'frontend/**'
      - 'tools/demo-d4-offline.cjs'
      - 'tools/demo-server.cjs'
      - 'tests/demo-d4.mjs'
      - '.github/workflows/demo-d4-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edunext-d4-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Localizar navegador Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No hay Chrome/Chromium disponible para la prueba offline." >&2
            exit 1
          fi
          echo "DEMO_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Validar inventario y política offline D4
        run: |
          node tests/demo-d4.mjs
          node tests/offline-pwa.cjs
          node --check frontend/sw.js
          node --check frontend/js/demo/offline-packages.js
          node --check frontend/js/demo/offline-status.js
      - name: Preparar paquetes, desactivar red, recargar y recorrer perfiles
        env:
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Prueba offline de Chrome, intento $attempt/3"
            if node tools/demo-d4-offline.cjs; then
              exit 0
            fi
            sleep 3
          done
          echo "La prueba offline no pudo completarse tras tres intentos." >&2
          exit 1
