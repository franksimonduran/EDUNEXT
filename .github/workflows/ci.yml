name: Local-source CI (not release approval)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AITHRON_FINAL_VALIDATION: '1'
      AITHRON_FINAL_EVIDENCE_DIR: docs/final/evidence/ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node tools/run-phase48-regression.cjs
      - run: node tests/demo-presentation.mjs
      - run: node tests/demo-d2.mjs
      - run: node tests/demo-d3.mjs
      - run: node tests/demo-d4.mjs
      - run: node tests/offline-pwa.cjs
      - run: node --check frontend/js/demo/offline-packages.js
      - run: node --check frontend/js/demo/offline-status.js
      - run: node --check frontend/sw.js
      - run: node --check frontend/js/demo/ai-tools.js
      - run: node --check frontend/js/demo/translation.js
      - run: node --check frontend/js/demo/pronunciation.js
      - run: node --check frontend/js/demo/role-pages.js
      - run: node --check frontend/js/demo/context-panel.js
      - run: node --check frontend/js/demo/metrics.js
      - run: node tests/local-ai-preview.cjs
      - run: node tests/local-tutor-general.cjs
      - run: node tests/phase49-infra.cjs
      - run: node tests/acceptance/phase50-acceptance.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-test-evidence-${{ github.sha }}
          path: |
            docs/final/evidence/ci-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          retention-days: 7
  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
        env:
          POSTGRES_DB: aithron_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only-not-a-deployment-secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d aithron_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      DEBUG: 'false'
      DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-only-not-a-deployment-secret@127.0.0.1:5432/aithron_ci_test
      AITHRON_AI_ENABLED: 'false'
      SYNC_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # Test environment may resolve ranges; this is NOT a reproducible release build.
      - run: python -m pip install '.[dev]'
      - run: python -m alembic upgrade head
      - run: python -m unittest discover -s verification -p 'test_phase*_security.py'
      # Existing verification tests use isolated transactional synthetic schemas.
      # Do not invoke tests/conftest.py, which resets database tables.
      - run: python -m pytest verification --noconftest -q
