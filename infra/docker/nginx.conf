pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 5m;
    log_format technical '$request_method $status $request_time';
    access_log /dev/stdout technical;
    map $uri $cache_policy { ~^/api/ no-store; default no-cache; }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html login.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # Conservative cache policy for unhashed HTML/modules/SW. No private cache.
        add_header Cache-Control $cache_policy always;
        location /api/v1/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_cache off;
        }
        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
