<!doctype html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18469e">
  <meta name="description" content="Ingresa a tu espacio de aprendizaje en EDUNEXT.">
  <title>Iniciar sesión | EDUNEXT</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/branding/mark.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth-layout.css">
  <link rel="stylesheet" href="css/pages/login.css">
  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="js/offline/bootstrap.js"></script>
</head>
<body class="corporate-ui scene-login">
  <a class="skip-link" href="#identifier">Ir al formulario</a>
  <main class="login-layout">
    <section class="brand-panel" aria-label="EDUNEXT, tu espacio de aprendizaje">
      <div class="brand"><img src="assets/images/Logo%20Horizontal.png" alt="EDUNEXT" width="400" height="134"></div>
      <div class="brand-story">
        <h2>Aprende donde estés.</h2>
        <p>Tu próximo descubrimiento empieza aquí.</p>
      </div>
      <div class="indicators" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
    <section class="form-panel" aria-labelledby="login-title">
      <div class="auth-card">
        <header class="card-heading">
          <img class="login-wordmark" src="assets/images/Logo%20Horizontal.png" alt="EDUNEXT" width="400" height="134">
          <h1 id="login-title">Bienvenido de nuevo</h1>
          <p>Tu compañero en el aprendizaje</p>
        </header>
        <form id="login-form" class="login-form" novalidate aria-busy="false">
          <div class="form-field">
            <label for="identifier">Correo o usuario</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
              <input class="form-input" id="identifier" name="identifier" type="text" placeholder="Tu correo o nombre de usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="identifier-error">
            </div>
            <p class="field-error" id="identifier-error" aria-live="polite" hidden></p>
          </div>
          <div class="form-field">
            <label for="password">Contraseña</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
              <input class="form-input password-input" id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required aria-describedby="password-error">
              <button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
              </button>
            </div>
            <p class="field-error" id="password-error" aria-live="polite" hidden></p>
          </div>
          <div class="recovery"><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></div>
          <button class="button-primary" id="submit-button" type="submit" disabled>
            <span class="spinner" id="submit-spinner" aria-hidden="true" hidden></span>
            <span id="submit-label">Iniciar sesión</span>
            <svg id="submit-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
          </button>
        </form>
        <p class="notice" id="form-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="register">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        <p class="register"><a href="demo.html">Explorar demo sin iniciar sesión</a> · Datos ficticios</p>
        <noscript><p class="no-script">Activa JavaScript para utilizar el formulario. La autenticación todavía no está disponible.</p></noscript>
      </div>
      <footer class="identity-footer"><span>EDUNEXT</span> · APRENDER SIN LÍMITES</footer>
    </section>
  </main>
</body>
</html>
