<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paquetes Educativos Offline | EDUNEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin/layout.css">
  <link rel="stylesheet" href="../css/admin/offline-packages.css">
  <link rel="stylesheet" href="../css/admin/content-admin-responsive.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="admin-content" aria-live="polite">
        <header class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Migas de pan"><a href="index.html">Administración</a><span>/</span><span>Paquetes Offline</span></nav>
            <h1>Paquetes Educativos Offline</h1>
            <p class="page-subtitle">Comprueba los recursos necesarios para trabajar sin conexión</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="contenidos.html">Catálogo</a>
            <a class="button-secondary" href="recursos-institucionales.html">Recursos</a>
          </div>
        </header>
        <section class="packages-toolbar">
          <div class="field"><span>Contenido</span><select id="pkg-content"></select></div>
          <div class="field"><span>Versión</span><select id="pkg-version"></select></div>
          <button class="button-primary" id="check-package" type="button">Comprobar preparación offline</button>
        </section>
        <section class="summary-grid" id="pkg-summary"></section>
        <div class="pkg-grid">
          <section class="panel"><h2>Manifiesto</h2><div id="pkg-manifest"></div></section>
          <section class="panel"><h2>Recursos obligatorios</h2><div id="pkg-required"></div></section>
          <section class="panel"><h2>Recursos opcionales</h2><div id="pkg-optional"></div></section>
          <section class="panel"><h2>Dependencias</h2><div id="pkg-deps"></div></section>
          <section class="panel panel-wide"><h2>Estado de preparación</h2><div id="pkg-ready"></div></section>
        </div>
      </main>
    </div>
  </div>
  <dialog class="admin-dialog" id="admin-dialog">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script type="module" src="../js/admin/offline-packages.js"></script>
</body>
</html>
