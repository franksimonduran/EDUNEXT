<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Almacenamiento Local | EDUNEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin/layout.css">
  <link rel="stylesheet" href="../css/admin/sync.css">
  <link rel="stylesheet" href="../css/admin/system-control-responsive.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="admin-content" aria-live="polite">
        <header class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Migas de pan"><a href="index.html">Administración</a><span>/</span><a href="sync.html">EDUNEXT Sync</a><span>/</span><span>Almacenamiento Local</span></nav>
            <h1>Almacenamiento Local</h1>
            <p class="page-subtitle">Consulta el almacenamiento utilizado por EDUNEXT en este navegador</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="sync.html">Centro de Control</a>
            <button class="button-primary" id="refresh-storage">Actualizar</button>
          </div>
        </header>
        <section class="storage-summary" id="storage-summary"></section>
        <div class="storage-panels">
          <section class="storage-panel" id="idb-detail"></section>
          <section class="storage-panel" id="usage-detail"></section>
          <section class="storage-panel" id="meta-detail"></section>
        </div>
      </main>
    </div>
  </div>
  <dialog class="admin-dialog" id="admin-dialog">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script type="module" src="../js/admin/local-storage.js"></script>
</body>
</html>
