<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operaciones de Sincronización | EDUNEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin/layout.css">
  <link rel="stylesheet" href="../css/admin/sync.css">
  <link rel="stylesheet" href="../css/admin/system-control-responsive.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="admin-content" aria-live="polite">
        <section class="demo-banner">
          <strong>Operaciones locales — No se simula sincronización con servidor.</strong>
        </section>
        <header class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Migas de pan"><a href="index.html">Administración</a><span>/</span><a href="sync.html">EDUNEXT Sync</a><span>/</span><span>Operaciones</span></nav>
            <h1>Operaciones de Sincronización</h1>
            <p class="page-subtitle">Consulta las operaciones locales registradas por EDUNEXT</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="sync.html">Centro de Control</a>
          </div>
        </header>
        <form class="filter-card" id="op-filters" aria-label="Filtros de operaciones">
          <div class="filter-grid">
            <label class="field"><span>Estado</span><select name="status"><option value="">Todos</option><option value="pendiente">Pendiente</option><option value="en-proceso">En proceso</option><option value="error-temporal">Error temporal</option><option value="confirmado">Confirmado</option></select></label>
            <label class="field"><span>Tipo</span><select name="type"><option value="">Todos</option><option value="draft-created">Borrador creado</option><option value="proposal-created">Propuesta administrativa</option><option value="review-completed">Revisión completada</option><option value="evaluation-registered">Evaluación registrada</option><option value="resource-added">Recurso agregado</option><option value="validation-executed">Validación ejecutada</option><option value="config-modified">Configuración modificada</option><option value="package-downloaded">Paquete descargado</option><option value="package-verified">Paquete verificado</option><option value="sync-attempted">Intento de sincronización</option></select></label>
            <label class="field"><span>Desde</span><input type="date" name="from"></label>
            <label class="field"><span>Hasta</span><input type="date" name="to"></label>
            <label class="field field-search"><span>Buscar</span><input type="search" name="q" placeholder="ID de operación"></label>
          </div>
          <div class="filter-actions"><button class="button-secondary" type="reset">Limpiar filtros</button><button class="button-primary" type="submit">Filtrar</button></div>
        </form>
        <section class="operations-section">
          <header class="section-header"><h2>Operaciones locales</h2><p id="op-count" role="status"></p></header>
          <div id="operations-container"></div>
        </section>
      </main>
    </div>
  </div>
  <dialog class="admin-dialog" id="admin-dialog">
    <div class="dialog-header"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="Cerrar">×</button></div>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script type="module" src="../js/admin/sync-operaciones.js"></script>
</body>
</html>
