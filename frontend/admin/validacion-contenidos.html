<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validación de Contenidos | EDUNEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin/layout.css">
  <link rel="stylesheet" href="../css/admin/content-validation.css">
  <link rel="stylesheet" href="../css/admin/content-admin-responsive.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="admin-content" aria-live="polite">
        <header class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Migas de pan"><a href="index.html">Administración</a><span>/</span><span>Validación de Contenidos</span></nav>
            <h1>Validación de Contenidos</h1>
            <p class="page-subtitle">Comprueba la estructura, accesibilidad y recursos de los materiales educativos</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="contenidos.html">Catálogo</a>
            <a class="button-secondary" href="revision-contenidos.html">Centro de Revisión</a>
          </div>
        </header>
        <section class="validation-toolbar">
          <div class="field"><span>Contenido</span><select id="val-content"></select></div>
          <div class="field"><span>Versión</span><select id="val-version"></select></div>
          <button class="button-primary" id="run-validation" type="button">Ejecutar validación</button>
          <span id="val-meta" class="muted"></span>
        </section>
        <section class="summary-grid" id="val-summary"></section>
        <div class="validation-grid">
          <section class="panel"><h2>Estructura</h2><div id="val-structure"></div></section>
          <section class="panel"><h2>Contenido</h2><div id="val-content-blocks"></div></section>
          <section class="panel"><h2>Recursos</h2><div id="val-resources"></div></section>
          <section class="panel"><h2>Accesibilidad</h2><div id="val-access"></div></section>
          <section class="panel"><h2>Compatibilidad</h2><div id="val-compat"></div></section>
          <section class="panel"><h2>Offline</h2><div id="val-offline"></div></section>
          <section class="panel"><h2>Seguridad</h2><div id="val-security"></div></section>
        </div>
        <section class="panel panel-wide"><h2>Detalle de resultados</h2><div id="val-details"></div></section>
      </main>
    </div>
  </div>
  <dialog class="admin-dialog" id="admin-dialog">
    <div class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button class="icon-button" id="close-dialog" aria-label="Cerrar">×</button>
    </div>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script type="module" src="../js/admin/content-validation.js"></script>
</body>
</html>
