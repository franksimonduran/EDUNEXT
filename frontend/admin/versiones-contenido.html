<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Versiones y Comparación | EDUNEXT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin/layout.css">
  <link rel="stylesheet" href="../css/admin/content-versions.css">
  <link rel="stylesheet" href="../css/admin/content-admin-responsive.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-content" id="admin-content" aria-live="polite">
        <header class="page-header">
          <div>
            <nav class="breadcrumb" aria-label="Migas de pan"><a href="index.html">Administración</a><span>/</span><a href="contenidos.html">Contenidos</a><span>/</span><span>Versiones</span></nav>
            <h1>Versiones y Cambios</h1>
            <p class="page-subtitle">Consulta cómo ha evolucionado el material educativo</p>
          </div>
          <div class="page-actions">
            <a class="button-secondary" href="contenidos.html">Volver al catálogo</a>
          </div>
        </header>
        <section class="versions-toolbar">
          <div class="field"><span>Contenido</span><select id="ver-content"></select></div>
          <div class="field"><span>Versión anterior</span><select id="ver-old"></select></div>
          <div class="field"><span>Versión nueva</span><select id="ver-new"></select></div>
          <button class="button-primary" id="compare-versions" type="button">Comparar</button>
        </section>
        <section class="timeline" id="version-timeline"></section>
        <section class="compare-grid">
          <section class="panel"><h2>Resumen de diferencias</h2><div id="diff-summary"></div></section>
          <section class="panel panel-wide"><h2>Comparación de bloques</h2><div id="diff-blocks"></div></section>
          <section class="panel"><h2>Metadatos</h2><div id="diff-meta"></div></section>
          <section class="panel"><h2>Recursos vinculados</h2><div id="diff-res"></div></section>
        </section>
      </main>
    </div>
  </div>
  <dialog class="admin-dialog" id="admin-dialog">
    <div class="dialog-header">
      <h2 id="dialog-title"></h2>
      <button class="icon-button" id="close-dialog" aria-label="Cerrar">×</button>
    </div>
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
  <script type="module" src="../js/admin/content-versions.js"></script>
</body>
</html>
